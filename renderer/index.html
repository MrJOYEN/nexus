<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Nexus</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar : toujours visible. Le reste de la fenetre est recouvert par la
         WebContentsView du service actif (gere dans main.js). -->
    <nav id="sidebar" aria-label="Services">
      <div id="services"></div>

      <div id="sidebar-actions">
        <button id="update-btn" class="action update hidden" type="button" title="Mise a jour">
          <span aria-hidden="true">↑</span>
        </button>
        <button id="add-btn" class="action" type="button" title="Ajouter un service">
          <span aria-hidden="true">+</span>
        </button>
      </div>
    </nav>

    <!-- Zone principale : visible quand la vue du service est masquee — erreur de
         chargement, service en veille, ou boite de dialogue ouverte. -->
    <main id="content">
      <div id="overlay" class="hidden">
        <div class="overlay-card">
          <div class="overlay-avatar" id="overlay-avatar">--</div>
          <h1 id="overlay-title">Chargement...</h1>
          <p id="overlay-message"></p>
          <button id="overlay-retry" class="hidden" type="button">Reessayer</button>
        </div>
      </div>

      <!-- Deux densites, une seule vue : la galerie occupe tout tant qu'aucun
           service n'est choisi, puis se resserre pour laisser place aux
           reglages. La classe .picked sur #modal fait la bascule. -->
      <div id="modal" class="hidden">
        <div id="picker">
          <header class="picker-head">
            <h1 id="form-title">Add a service</h1>
            <button id="form-cancel" type="button" class="ghost" aria-label="Close">&times;</button>
          </header>

          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              id="f-search"
              type="text"
              autocomplete="off"
              placeholder="Search services, or paste any address"
            />
          </div>

          <div id="catalog-grid"></div>
          <p id="catalog-empty" class="hidden">
            No match. Paste the address above to add it anyway.
          </p>
        </div>

        <form id="service-form" autocomplete="off">
          <div class="preview">
            <span class="preview-logo" id="preview-logo"><img alt="" hidden /><span></span></span>
            <span class="preview-meta">
              <b id="preview-name">New service</b>
              <span id="preview-slot">Appears at the end of the sidebar</span>
            </span>
          </div>

          <label class="field">
            <span>Name</span>
            <input id="f-name" type="text" maxlength="60" required placeholder="WhatsApp Work" />
          </label>

          <label class="field">
            <span>Address</span>
            <input id="f-url" type="text" required placeholder="https://web.whatsapp.com" />
          </label>

          <div class="row">
            <label class="field">
              <span>Initials</span>
              <input id="f-initials" type="text" maxlength="4" placeholder="WW" />
            </label>
            <label class="field color">
              <span>Colour</span>
              <input id="f-color" type="color" value="#45475a" />
            </label>
          </div>

          <label class="field">
            <span>Sleep when unused</span>
            <select id="f-hibernate">
              <option value="0">Never</option>
              <option value="15">After 15 minutes</option>
              <option value="30">After 30 minutes</option>
              <option value="60">After 1 hour</option>
              <option value="180">After 3 hours</option>
            </select>
            <small>Frees memory, but stops badges and notifications until you come back.</small>
          </label>

          <label class="check">
            <input id="f-spoof" type="checkbox" />
            <span>
              Identify as Chrome
              <small>Required by WhatsApp, which turns Electron browsers away.</small>
            </span>
          </label>

          <label class="check">
            <input id="f-preload" type="checkbox" checked />
            <span>
              Load at startup
              <small>Without it, no badge and no notification until you first open it.</small>
            </span>
          </label>

          <p id="form-error" class="hidden"></p>

          <div class="form-actions">
            <button id="form-delete" class="danger hidden" type="button">Delete</button>
            <span class="spacer"></span>
            <button id="form-back" type="button">Back</button>
            <button id="form-save" class="primary" type="submit">Add service</button>
          </div>
        </form>
      </div>
    </main>

    <script src="sidebar.js"></script>
  </body>
</html>
